name: CI

# Builds both Windows (MSVC + vcpkg) and Linux (GCC + system packages).
#
# Note: the Linux job requires cmake/LinuxDeps.cmake and related changes from
# the feature/linux-support branch. It will pass once that PR is merged.

on:
  push:
    branches: [master, main, 'feature/**', 'fix/**']
  pull_request:

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Windows build via MSVC + vcpkg
  # ─────────────────────────────────────────────────────────────────────────
  build-windows:
    name: Windows (MSVC + vcpkg)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup vcpkg (with cache)
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: b545373a9a536dc559dac8583467a21497a0e897

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure (CMake)
        run: >
          cmake -S . -B build
          --preset default
          -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: witness-windows-x64
          path: |
            build/bin/WitnessServer.exe
            build/bin/WitnessCamera.dll
            build/bin/WitnessCommon.dll
          if-no-files-found: warn
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # Linux build via GCC + system packages
  # ─────────────────────────────────────────────────────────────────────────
  build-linux:
    name: Linux (GCC + system packages)
    runs-on: ubuntu-24.04

    env:
      ORT_VERSION: "1.24.4"
      CROW_VERSION: "1.3.2"

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config g++ \
            libavcodec-dev libavformat-dev libavutil-dev \
            libswscale-dev libswresample-dev \
            libopencv-dev \
            libsodium-dev \
            libsqlite3-dev \
            libssl-dev \
            libasio-dev \
            libboost-dev

      - name: Cache ONNX Runtime
        id: cache-ort
        uses: actions/cache@v4
        with:
          path: ~/onnxruntime
          key: onnxruntime-linux-x64-${{ env.ORT_VERSION }}

      - name: Download ONNX Runtime
        if: steps.cache-ort.outputs.cache-hit != 'true'
        run: |
          wget -q "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_VERSION}.tgz"
          tar xzf "onnxruntime-linux-x64-${ORT_VERSION}.tgz"
          mv "onnxruntime-linux-x64-${ORT_VERSION}" ~/onnxruntime

      - name: Cache Crow
        id: cache-crow
        uses: actions/cache@v4
        with:
          path: ~/crow
          key: crow-linux-${{ env.CROW_VERSION }}

      - name: Download Crow
        if: steps.cache-crow.outputs.cache-hit != 'true'
        run: |
          wget -q "https://github.com/CrowCpp/Crow/releases/download/v${CROW_VERSION}/Crow-${CROW_VERSION}-Linux.tar.gz"
          mkdir ~/crow && tar xzf "Crow-${CROW_VERSION}-Linux.tar.gz" -C ~/crow --strip-components=1

      - name: Configure (CMake)
        run: |
          cmake -S . -B build-linux -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DWITNESS_USE_SYSTEM_DEPS=ON \
            -DONNXRUNTIME_INCLUDE_DIR=$HOME/onnxruntime/include \
            -DONNXRUNTIME_LIB=$HOME/onnxruntime/lib/libonnxruntime.so \
            -DCROW_INCLUDE_DIR=$HOME/crow/include \
            -DCMAKE_PREFIX_PATH="$HOME/onnxruntime"

      - name: Build
        run: cmake --build build-linux --parallel $(nproc)

      - name: Smoke test (createdb)
        run: |
          mkdir -p /tmp/witness-data
          HOME=/tmp/witness-data ./build-linux/bin/WitnessServer /createdb
          echo "Database created successfully"

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: witness-linux-x64
          path: |
            build-linux/bin/WitnessServer
            build-linux/bin/libWitnessCamera.so
            build-linux/bin/libWitnessCommon.so
          if-no-files-found: warn
          retention-days: 7
