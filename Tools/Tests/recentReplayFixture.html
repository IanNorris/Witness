<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Witness recent replay fixture</title></head>
<body><div id="app"></div><script type="module">
import { createApp, ref, onMounted, onUnmounted } from 'vue'
import { createPinia } from 'pinia'
import { createRouter, createWebHistory } from 'vue-router'
import CameraGrid from '/web-ui/src/components/camera/CameraGrid.vue'
import RecentReplayOverlay from '/web-ui/src/components/clips/RecentReplayOverlay.vue'
import { useCameraStore } from '/web-ui/src/stores/cameras.ts'
import { useSettingsStore } from '/web-ui/src/stores/settings.ts'
import '/web-ui/src/assets/styles/main.scss'
const app = createApp({
  components: { CameraGrid, RecentReplayOverlay },
  setup() {
    const cameraStore = useCameraStore(), settings = useSettingsStore()
    settings.streamingMode = 'jpeg'
    cameraStore.isLoading = false
    cameraStore.cameras = [8, 9].map(id => ({ id, name: `Synthetic camera ${id}`, status: 'Connected', isRecording: true, motionActive: false, groups: [], previewUrl: '', streamUrl: '', stats: {fps: 15, bitrate: 0, uptime: '', reconnects: 0} }))
    const replay = ref(null), status = ref('Starting fixture')
    let originals = [], timer
    onMounted(() => {
      originals = [...document.querySelectorAll('.camera-grid-item .camera-card')]
      timer = setInterval(() => {
        const current = [...document.querySelectorAll('.camera-grid-item .camera-card')]
        const video = document.querySelector('.recent-replay-panel video.active')
        status.value = `Live cards preserved: ${originals.length === 2 && originals.every((node, i) => node === current[i])}; recording still active: ${cameraStore.cameras.every(c => c.isRecording)}; replay ready: ${video?.readyState ?? '-'}; replay time: ${video?.currentTime?.toFixed(1) ?? '-'}s`
      }, 500)
    })
    onUnmounted(() => clearInterval(timer))
    return { replay, status, settings }
  },
  template: `<main class="container py-4"><h1>Recent replay — synthetic fixture</h1><p>No real cameras, database or credentials are used.</p><button class="btn btn-secondary" @click="settings.fullscreenMode = true">Fullscreen fixture</button><output>{{ status }}</output><CameraGrid @replay="replay = $event" /><RecentReplayOverlay v-if="replay" :camera-id="replay" :camera-name="'Synthetic camera ' + replay" @close="replay = null" /></main>`
})
app.use(createPinia()).use(createRouter({history: createWebHistory(), routes: []})).mount('#app')
</script></body></html>
