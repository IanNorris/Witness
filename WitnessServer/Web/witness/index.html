<!DOCTYPE html>
<html lang="en">

<head>

	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Witness</title>

	<link rel="stylesheet" type="text/css" href="asset/css/bootstrap.min.css">

	<link rel="stylesheet" type="text/css" href="asset/css/plugins/font-awesome.min.css" />
	<link rel="stylesheet" type="text/css" href="asset/css/plugins/simple-line-icons.css" />
	<link rel="stylesheet" type="text/css" href="asset/css/plugins/animate.min.css" />
	<link rel="stylesheet" type="text/css" href="asset/css/plugins/fullcalendar.min.css" />
	<link rel="stylesheet" type="text/css" href="asset/css/jquery.toast.min.css" />
	<link rel="stylesheet" type="text/css" href="asset/css/plugins/datatables.bootstrap.min.css">
	<link rel="stylesheet" type="text/css" href="asset/select2/css/select2.min.css" />

	<link href="asset/css/style.css" rel="stylesheet">

	<link rel="shortcut icon" href="asset/img/logomi.png">
	<!-- HTML5 shim and Respond.js IE8 support of HTML5 elements and media queries -->
	<!--[if lt IE 9]>
      <script src="https://oss.maxcdn.com/html5shiv/3.7.2/html5shiv.min.js"></script>
      <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
    <![endif]-->
</head>

<body id="mimin" class="dashboard">

	<div data-bind="visible: ready" style="display:none">
		<nav class="navbar navbar-default header navbar-fixed-top">
			<div class="col-md-12 nav-wrapper">
				<div class="navbar-header">
					<div class="opener-left-menu">
					</div>
					<a href="/witness/" class="navbar-brand">
						<b class="navbar-brand-label">Witness</b>
					</a>
				</div>

				<ul class="nav navbar-nav navbar-right user-nav" data-bind="with: authentication" template-path="userMenu.html"/>
			</div>
		</nav>
		<!-- end: Header -->

		<div class="container-fluid mimin-wrapper">

			<!-- start:Left Menu -->
			<div id="left-menu" template-path="leftMenu.html"></div>

			<div id="content">
				<div class="panel box-shadow-none content-header" template-path="preview.html"></div>

				<div class="col-md-12" style="padding:20px;">
					<div class="panel animated fadeIn" data-bind="with: clipBrowser, visible: isViewMode(VIEW_MODE_CLIPS)" template-path="clips.html"></div>
					
					<!-- ko with: adminController -->
					<div class="panel animated fadeIn" data-bind="with: cameras, visible: $parent.isViewMode(VIEW_MODE_ADMIN)" template-path="admin/cameras.html"></div>
					<div class="panel animated fadeIn" data-bind="with: groups, visible: $parent.isViewMode(VIEW_MODE_ADMIN)" template-path="admin/groups.html"></div>
					<div class="panel animated fadeIn" data-bind="with: users, visible: $parent.isViewMode(VIEW_MODE_ADMIN)" template-path="admin/users.html"></div>
					<!-- /ko -->
				</div>
			</div>
		</div>

		<!-- Admin dialogs -->
		<div class="modal fade" id="addUserAdmin" tabindex="-1" role="dialog" aria-labelledby="addUserAdminLabel" aria-hidden="true" template-path="admin/addUserDialog.html"></div>
		<div class="modal fade" id="createdUserAdmin" tabindex="-1" role="dialog" aria-labelledby="createdUserAdminLabel" aria-hidden="true" template-path="admin/createdUserDialog.html"></div>
		<div class="modal fade" id="addGroupAdmin" tabindex="-1" role="dialog" aria-labelledby="addGroupAdminLabel" aria-hidden="true" template-path="admin/addGroupDialog.html"></div>
		<div class="modal fade" id="deleteGroupAdmin" tabindex="-1" role="dialog" aria-labelledby="deleteGroupAdminLabel" aria-hidden="true" template-path="admin/deleteGroupDialog.html"></div>
		<div class="modal fade" id="addCameraAdmin" tabindex="-1" role="dialog" aria-labelledby="addCameraAdminLabel" aria-hidden="true" template-path="admin/addCameraDialog.html"></div>

		<div class="spinner-background" data-bind="fadeVisible: notReady" style="display:none">
			<div class="spinner-container"></div>
			<div class="spinner-container2"></div>
		</div>

		<script src="asset/js/jquery.min.js"></script>
		<script src="asset/js/jquery.ui.min.js"></script>
		<script src="asset/js/jquery.toast.min.js"></script>
		<script src="asset/js/bootstrap.min.js"></script>

		<script src="asset/js/knockout-3.4.2.js"></script>

		<script src="asset/js/knockout-utilities.js"></script>

		<script src="asset/js/plugins/moment.min.js"></script>
		<script src="asset/js/plugins/jquery.nicescroll.js"></script>
		<script src="asset/js/plugins/jquery.datatables.min.js"></script>
		<script src="asset/js/plugins/moment.min.js"></script>
		<script src="asset/js/plugins/datatables.bootstrap.min.js"></script>
		<script src="asset/select2/js/select2.full.min.js"></script>
		
		<script>
			//Load all the templates
			var jobsStarted = 0;
			var basePath = "/witness/asset/templates/"
			$('[template-path]').each( function() {
				jobsStarted++;
				$(this).load( basePath + $(this).attr('template-path'), function(){
					if( --jobsStarted == 0 ) {
						$('body').trigger("witnessTemplatesLoaded");
					}
				});
			} );
		</script>
		
		<script src="asset/js/utilities.js"></script>
		
		<script src="asset/js/viewModels/admin.js"></script>
		<script src="asset/js/viewModels/adminCameras.js"></script>
		<script src="asset/js/viewModels/adminGroup.js"></script>
		<script src="asset/js/viewModels/adminGroups.js"></script>
		<script src="asset/js/viewModels/adminUser.js"></script>
		<script src="asset/js/viewModels/adminUsers.js"></script>
		<script src="asset/js/viewModels/authentication.js"></script>
		<script src="asset/js/viewModels/camera.js"></script>
		<script src="asset/js/viewModels/cameraClips.js"></script>
		<script src="asset/js/viewModels/clip.js"></script>
		<script src="asset/js/viewModels/witness.js"></script>

		<script src="asset/js/main-ui.js"></script>
		<script src="asset/js/main.js"></script>
</body>
</html>
