<li class="user-name">
	<span data-bind="text: displayName"></span>
</li>
<li class="dropdown avatar-dropdown">
	<img src="asset/img/avatar.jpg" class="img-circle avatar" alt="user name" data-toggle="dropdown" aria-haspopup="true" aria-expanded="true"
	/>
	<ul class="dropdown-menu user-dropdown">
		<li>
			<a href="#">
				<span class="fa fa-cogs"></span> Settings</a>
		</li>
		<!-- ko if: admin -->
		<li>
			<a name="Administration" class="clickable" data-bind="click: adminAction">
				<span class="fa fa-users"></span> Administration</a>
		</li>
		<!-- /ko -->
		<li>
			<a data-bind="click: logoutAction">
				<span class="fa fa-power-off"></span> Log out</a>
		</li>
	</ul>
</li>
