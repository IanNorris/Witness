<div class="panel-heading">
	<div class="row row-same-height">
		<div class="col-sm-8">
			<h3>Administration - Debugging</h3>
		</div>
	</div>
	<div class="panel-body">
		<div class="responsive-table">
			<div class="dataTables_wrapper form-inline dt-bootstrap no-footer">
				<div class="row">
					<div class="col-sm-12">
						<table class="table table-striped table-bordered dataTable no-footer" width="100%" style="width: 100%">
							<thead>
								<th width="40%">Name</th>
								<th width="40%">Value</th>
								<th width="20%">Options</th>
							</thead>
							<tbody data-bind="foreach: values">
								<tr role="row" class="even form-animate-checkbox" data-bind="css: { odd: ($index() % 2 == 1), even: ($index() % 2 == 0) }">
									<td nowrap data-bind="text: name"></td>
									<td nowrap>
										<input type="text" class="form-control android" style="width:100%" data-bind="value: value"></input>
									</td>
									<td nowrap>
										<button class="btn btn-default" data-bind="click: resetValue"><span class="fa fa-sync-alt"></span> Reset</button>
									</td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
