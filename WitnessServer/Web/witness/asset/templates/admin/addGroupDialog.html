<div class="modal-dialog" role="document">
	<!-- ko with: adminController -->
	<div class="modal-content" data-bind="with: groups">
		<div class="modal-header">
			<h5 class="modal-title" id="addGroupAdminLabel">Add new group</h5>
			<button type="button" class="close" data-dismiss="modal" aria-label="Close" style="margin-top:-20px">
				<span aria-hidden="true">&times;</span>
			</button>
		</div>
		<div class="modal-body">
			<div class="row">
				<div class="col-md-12">
					<div class="form-group">
						<label class="col-sm-4 control-label text-right">Group name</label>
						<div class="col-sm-8">
							<input type="text" class="form-control android" data-bind="value: newGroupNameBound" />
						</div>
					</div>
				</div>
			</div>
			<div class="row">
				<div class="col-md-12">
					<div class="form-group">
						<label class="col-sm-4 control-label text-right">Description</label>
						<div class="col-sm-8">
							<input type="text" class="form-control android" data-bind="value: newGroupDescriptionBound" />
						</div>
					</div>
				</div>
			</div>
		</div>
		<div class="modal-footer">
			<button type="button" class="btn btn-primary" data-bind="click: createNewGroup, disable: isBusy"><span data-bind="visible: isBusy"><i class="fa fa-spinner fa-spin"/></span> Add group</button>
			<button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
		</div>
	</div>
	<!-- /ko -->
</div>
