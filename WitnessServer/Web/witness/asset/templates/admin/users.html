<div class="panel-heading">
	<div class="row row-same-height">
		<div class="col-sm-8">
			<h3>Administration - Users</h3>
		</div>
		<div class="col-sm-4" style="align-self:flex-end;adding-right:2em">
			<div style="text-align:right">
				<button class=" btn btn-sm btn-circle btn-primary" value="primary" data-toggle="modal" data-target="#addUserAdmin">
					<span class="fa fa-plus"></span>
				</button>
			</div>
		</div>
	</div>
	<div class="panel-body">
		<div class="responsive-table">
			<div class="dataTables_wrapper form-inline dt-bootstrap no-footer">
				<div class="row">
					<div class="col-sm-12">
						<table class="table table-striped table-bordered dataTable no-footer" width="100%" style="width: 100%">
							<thead>
								<th width="25%">Username</th>
								<th width="25%">Display Name</th>
								<th width="25%">Accessible Groups</th>
								<th>Enabled</th>
								<th>Administrator</th>
								<th>Actions</th>
							</thead>
							<tbody data-bind="foreach: users">
								<tr role="row" class="even form-animate-checkbox" data-bind="css: { odd: ($index() % 2 == 1), even: ($index() % 2 == 0) }">
									<td nowrap data-bind="text: username"></td>
									<td nowrap>
										<input type="text" class="form-control android" style="width:100%" data-bind="value: displayName"></input>
									</td>
									<td nowrap>
										<select multiple="multiple" data-bind="selected: userGroups, options: $parent.groups.groups, optionsText: 'text', optionsValue: 'id', select2: { placeholder: 'Pick groups user can access', valueAllowUnset: true }"
										  class="select2" style="width:100%"></select>
									</td>
									<td nowrap>
										<input type="checkbox" class="checkbox" data-bind="checked: enabled, click: toggleEnabled, disable: isSelf"></input>
									</td>
									<td nowrap>
										<input type="checkbox" class="checkbox" data-bind="checked: admin, click: toggleAdmin, disable: isSelf" /></input>
									</td>
									<td nowrap>
										<button class="btn btn-default" data-bind="disable: isSelf">
											<span class="fa fa-delete"></span> Delete</button>
										<button class="btn btn-default">
											<span class="fa fa-delete"></span> Change Password</button>
									</td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
