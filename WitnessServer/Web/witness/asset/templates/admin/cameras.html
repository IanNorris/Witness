<div class="panel-heading">
	<div class="row row-same-height">
		<div class="col-sm-8">
			<h3>Administration - Cameras</h3>
		</div>
		<div class="col-sm-4" style="align-self:flex-end;adding-right:2em">
			<div style="text-align:right">
				<button class=" btn btn-sm btn-circle btn-primary" value="primary" data-toggle="modal" data-target="#addUserAdmin">
					<span class="fa fa-plus"></span>
				</button>
			</div>
		</div>
	</div>
	<div class="panel-body">
		<div class="responsive-table">
			<div class="dataTables_wrapper form-inline dt-bootstrap no-footer">
				<div class="row">
					<div class="col-sm-12">
						<table class="table table-striped table-bordered dataTable no-footer" width="100%" style="width: 100%">
							<thead>
								<th width="25%">Name</th>
								<th width="33%">Connection String</th>
								<th width="33%">Included In Groups</th>
								<th>Status</th>
								<th>Actions</th>
							</thead>
							<tbody data-bind="foreach: cameraList">
								<tr role="row" class="even" data-bind="css: { odd: ($index() % 2 == 1), even: ($index() % 2 == 0) }">
									<td nowrap>
										<input type="text" class="form-control android" style="width:100%" data-bind="value: cameraName"></input>
									</td>
									<td nowrap>
										<input type="text" class="form-control android" style="width:100%" data-bind="value: cameraPath"></input>
									</td>
									<td nowrap>
										<select multiple="multiple" data-bind="selected: cameraGroups, options: $parent.groups.groupList, optionsText: 'text', optionsValue: 'id', select2: { placeholder: 'Pick groups camera belongs to', valueAllowUnset: true }"
										  class="select2" style="width:100%"></select>
										Selected:
										<span data-bind="text: cameraGroups"></span>
									</td>
									<td nowrap>
										<span data-bind="value: cameraStatus"></span>
									</td>
									<td nowrap>
										<button class="btn btn-default">
											<span class="fa fa-delete"></span> Delete</button>
									</td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
