<div class="panel-heading">
	<div class="row row-same-height">
		<div class="col-sm-8">
			<h3>Administration - Cameras</h3>
		</div>
		<div class="col-sm-4" style="align-self:flex-end;adding-right:2em">
			<div style="text-align:right">
				<button class=" btn btn-sm btn-circle btn-info" data-bind="click: refreshCamerasAsAdmin">
					<span class="fa fa-refresh"></span>
				</button>
				
				<button class=" btn btn-sm btn-circle btn-primary" value="primary" data-toggle="modal" data-target="#addCameraAdmin">
					<span class="fa fa-plus"></span>
				</button>
			</div>
		</div>
	</div>
	<div class="panel-body">
		<div class="responsive-table">
			<div class="dataTables_wrapper form-inline dt-bootstrap no-footer">
				<div class="row">
					<div class="col-sm-12">
						<table class="table table-striped table-bordered dataTable no-footer" width="100%" style="width: 100%">
							<thead>
								<th width="5%">Enabled</th>
								<th width="20%">Name</th>
								<th width="20%">Description</th>
								<th width="20%">Connection String</th>
								<th width="20%">Included In Groups</th>
								<th width="10%">Status</th>
								<th width="5%">Actions</th>
							</thead>
							<tbody data-bind="foreach: cameras">
								<tr role="row" class="even" data-bind="css: { odd: ($index() % 2 == 1), even: ($index() % 2 == 0) }">
									<td nowrap>
										<input type="checkbox" data-bind="checked: enabled"></input>
									</td>
									<td nowrap>
										<input type="text" class="form-control android" style="width:100%" data-bind="value: name"></input>
									</td>
									<td nowrap>
										<input type="text" class="form-control android" style="width:100%" data-bind="value: description"></input>
									</td>
									<td nowrap>
										<input type="text" class="form-control android" style="width:100%" data-bind="value: connectionString"></input>
									</td>
									<td nowrap>
										<select multiple="multiple" data-bind="selected: groups, options: $parent.groups.groups, optionsText: 'text', optionsValue: 'id', select2: { placeholder: 'Pick groups camera belongs to', valueAllowUnset: true }"
										  class="select2" style="width:100%"></select>
									</td>
									<td nowrap>
										<table class="camera-stats-table">
											<tr>
												<td>Status</td>
												<td><span data-bind="text: status"></span></td>
											</tr>
											
											<tr>
												<td>Last Update </td>
												<td data-bind="text: moment(lastTimestamp()*1000).fromNow()"></td>
											</tr>
											
											<tr>
												<td>Frames </td>
												<td data-bind="text: statFrameCount"></td>
											</tr>
											
											<tr>
												<td>Total </td>
												<td><span data-bind="text: statProcessingTimeMS"></span>ms</td>
											</tr>
											
											<tr>
												<td>Scale </td>
												<td><span data-bind="text: statScaleProcessingTimeMS"></span>ms</td>
											</tr>
											
											<tr>
												<td>1st Filter </td>
												<td><span data-bind="text: statMotionDetectionProcessingTimeMS"></span>ms</td>
											</tr>
											
											<tr>
												<td>2nd Filter </td>
												<td><span data-bind="text: statSecondPassProcessingTimeMS"></span>ms</td>
											</tr>
										</table>
									</td>
									<td nowrap>
										<button class="btn btn-default">
											<span class="fa fa-delete"></span> Delete</button>
									</td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
