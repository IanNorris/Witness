<div class="panel-heading">
	<h3>Clips</h3>
</div>
<div class="panel-body">
	<div class="responsive-table">
		<div class="dataTables_wrapper form-inline dt-bootstrap no-footer">
			<div class="row">
				<div class="col-sm-6">
					<div class="dataTables_length">
						<label>Show
							<select class="form-control input-sm" data-bind="options: rangeOptions, value: maxCount, event: { change: changeMaxCount }"></select>
							entries</label>
					</div>
				</div>
				<div class="col-sm-6">
					<!--<div class="dataTables_filter">
						<label>Search:
							<input type="search" class="form-control input-sm" placeholder="" aria-controls="datatables-example">
						</label>
					</div>-->
				</div>
			</div>
			<div class="row">
				<div class="col-sm-12">
					<table class="table table-striped table-bordered dataTable no-footer" width="100%" style="width: 100%">
						<thead>
							<th tabindex="0">Preview</th>
							<th>When</th>
							<th>Duration</th>
							<th>Motion</th>
							<th>Type</th>
							<th>Actions</th>
						</thead>
						<tbody data-bind="foreach: clips">
							<tr role="row" class="even form-animate-checkbox" data-bind="css: { odd: ($index() % 2 == 1), even: ($index() % 2 == 0) }">
								<td style="width:400px;">
									<video controls preload="none" data-bind="attr: { poster: thumbnail }" width="150" height="100">
										<source data-bind="attr: { src: video }" type="video/mp4">
									</video>
								</td>
								<td data-bind="text: agoDesc"></td>
								<td data-bind="text: durationDesc"></td>
								<td data-bind="text: motionDesc"></td>
								<td data-bind="text: typeDesc"></td>
								<td>
									<span style="margin: 0.5em"><input type="checkbox" class="checkbox" data-bind="checked: saved, click: toggleSaved"> Save</input></span>
									<button class="btn btn-circle btn-mn btn-danger" data-bind="click: deleteClip"><i class="fa fa-trash"></i></button>
									
								</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
			<div class="row">
				<div class="col-sm-5">
					<div class="dataTables_info" role="status" aria-live="polite">Showing
						<span data-bind="text: clipPageStart"></span>-
						<span data-bind="text: clipPageEnd"></span> of
						<span data-bind="text: totalClipsInRange"></span>
					</div>
				</div>
				<div class="col-sm-7">
					<div class="dataTables_paginate paging_simple_numbers">
						<ul class="pagination">
							<li class="paginate_button" data-bind="css: { disabled: canNotDecrementPage }">
								<a data-bind="click: setFirstPage">&larr;</a>
							</li>
							<li class="paginate_button" data-bind="css: { disabled : canNotDecrementPage }">
								<a data-bind="click: decrementPage">&laquo;</a>
							</li>

							<!-- ko foreach: visiblePages -->
							<li class="paginate_button" data-bind="css: { active: $parent.isPage($data) }">
								<a data-bind="click: $parent.setPage.bind($data), text: $parent.getDisplayPage($data)"></a>
							</li>
							<!-- /ko -->

							<li class="paginate_button" data-bind="css: { disabled : canNotIncrementPage }">
								<a data-bind="click: incrementPage">&raquo;</a>
							</li>
							<li class="paginate_button" data-bind="css: { disabled: canNotIncrementPage }">
								<a data-bind="click: setLastPage">&rarr;</a>
							</li>
						</ul>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
