<div class="panel-heading">
	<h3>Live stream</h3>
</div>
<div class="panel-body">
	<!-- ko if: $root.isHlsMode() -->
	<video id="video" data-bind="hlsStream: cameraID" controls></video>

	<!-- ko ifnot: $root.isHlsMode() -->
	<img id="video" data-bind="attr: { src: camera.livePreviewPath() }" style="width:100%; height:auto;" />
	<!-- /ko -->
</div>
